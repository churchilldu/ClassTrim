# Plugin coordinates
pluginGroup = org.classtrim
pluginName = ClassTrim Refactoring
pluginVersion = 1.0.0

# IntelliJ Platform target — must match the version bundled with the Tools-menu
# action's IntelliJ runtime. 2024.1 ships with platform branch 241.
platformType = IC
platformVersion = 2024.1

# Compatibility window. since-build / until-build values live in plugin.xml,
# but these properties stay here so build-script logic can reference them.
pluginSinceBuild = 241
pluginUntilBuild = 251.*

# JVM tuning — IntelliJ Platform builds need a generous heap to load the IDE.
org.gradle.jvmargs = -Xmx2g -Dfile.encoding=UTF-8
org.gradle.caching = true
org.gradle.configuration-cache = true
